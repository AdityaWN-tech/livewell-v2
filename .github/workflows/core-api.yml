# Core API / Cloud Functions tests (T-FND-05 audit trigger and revoke handling, T-FND-09 audit log).
# Runs the real functions against the Firestore, Functions and Storage emulators.
name: core-api

on:
  pull_request:
    paths: ["services/core-api/**", "content/coach/**", "content/routine/**", "infra/terraform/modules/audit_log/**", "firebase.json", "firebase/storage.rules", ".github/workflows/core-api.yml"]
  push:
    branches: [main]
    paths: ["services/core-api/**", "content/coach/**", "content/routine/**", "infra/terraform/modules/audit_log/**", "firebase.json", "firebase/storage.rules", ".github/workflows/core-api.yml"]

concurrency:
  group: core-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/core-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/core-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
