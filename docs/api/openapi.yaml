openapi: 3.1.0
info:
  title: Live Well API
  version: "1"
  description: >
    Server endpoints (spec 12.1). Every call needs a Firebase ID token
    (Authorization: Bearer) and an App Check token (X-Firebase-AppCheck).
    Started in T-AVT-08c with the Media Service's avatar endpoints; other
    services add theirs here.
servers:
  - url: https://media.livewell.example/  # set per environment at deploy
security:
  - firebaseIdToken: []
    appCheck: []
paths:
  /v1/avatar:
    post:
      summary: Start making the coach's 3D avatar (Media Service, T-AVT-08c)
      description: >
        source selfie (From my photo; needs the avatar_from_photo flag and the
        camera and biometric consents), built (Build my own) or adjust (edit
        the approved portrait). Options are fixed ids from
        content/avatar/options.json; free text is refused. At most 3 a day
        (Remote Config avatar_daily_generations). The selfie is used for this
        job only and never stored.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AvatarRequest"}
      responses:
        "202":
          description: Job started (or the same job again for a repeated Idempotency-Key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvatarJob"}
        "401": {description: not_authorized}
        "403": {description: "feature_off | consent_required"}
        "413": {description: selfie_too_large}
        "422": {description: "bad_options | liveness_required | selfie_required | selfie_unreadable | selfie_not_jpeg | selfie_only_for_selfie_source"}
        "429": {description: avatar_daily_limit}
  /v1/avatar/jobs/{id}:
    get:
      summary: An avatar job's status (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvatarJob"}
        "401": {description: not_authorized}
        "404": {description: "not_found (also someone else's job)"}
  /speakMessage:
    post:
      summary: Closed-script TTS gateway (Core API callable `speakMessage`, T-VOC-07)
      description: >
        Spec 12.1 `GET /v1/tts/{message_id}/stream`, served for now as a
        Firebase callable in the core-api codebase (`{data: ...}` in,
        `{result: ...}` or `{error: {status, message, details.reason}}` out);
        streaming comes with the vendor (T-VOC-01). The only way to get speech
        in a coach voice. Takes an approved message_id, never text
        (FR-VOC-05): the server looks up the approved, versioned text itself
        (content/coach/moments, content/routine/catalog.json, approved
        content_items lessons, or users/{uid}/messages that passed the safety
        post-check). Cloned voices also need the voice's status active, the
        cloned-voices kill switch on and an active, unrevoked voice_consents
        record for this account; Dr. Gokula's voice is off until T-VOC-08.
        Safety ids (`safety.…`) and safety-category messages answer
        neutral_device with no reads (FR-VOC-07). Every refusal, synthesis
        and neutral routing is audited (ids and counts only). Until a vendor
        is configured an allowed request is refused as tts_unavailable.
      servers:
        - url: https://us-central1-PROJECT.cloudfunctions.net/  # Cloud Functions, per environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: {$ref: "#/components/schemas/SpeakRequest"}
      responses:
        "200":
          description: Synthesized audio, or "use the phone's neutral voice"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: {$ref: "#/components/schemas/SpeakResult"}
        "400": {description: "free_text_refused | bad_request | bad_params"}
        "401": {description: unauthenticated}
        "403": {description: "user_text_not_allowed | unsupported_voice_kind | voice_inactive | cloned_voices_off | gokula_voice_off | consent_missing | consent_revoked | consent_wrong_account"}
        "404": {description: "unknown_message | unknown_voice"}
        "412": {description: "retired_message | not_approved | unknown_placeholder"}
        "503": {description: tts_unavailable}
components:
  securitySchemes:
    firebaseIdToken: {type: http, scheme: bearer}
    appCheck: {type: apiKey, in: header, name: X-Firebase-AppCheck}
  schemas:
    AvatarRequest:
      type: object
      required: [source]
      properties:
        source: {type: string, enum: [selfie, built, adjust]}
        options:
          type: object
          maxProperties: 20
          additionalProperties: {type: string}
          description: category id → option id, from content/avatar/options.json
        selfie_jpeg_base64:
          type: string
          description: The live selfie (JPEG, at most 4 MB), only for source selfie
        liveness:
          type: string
          enum: [blink, turn]
          description: How the app saw a live person (T-AVT-08e); required for source selfie
    AvatarJob:
      type: object
      required: [job_id, source, status]
      properties:
        job_id: {type: string}
        source: {type: string, enum: [selfie, built, adjust]}
        status: {type: string, enum: [queued, running, succeeded, rejected, failed]}
        message_id:
          type: [string, "null"]
          description: "A kind message for the app to show: avatar_not_made | avatar_no_portrait"
        portrait_id:
          type: [string, "null"]
          description: The approved portrait the frame set is built from
        frames_version:
          type: [integer, "null"]
          description: >
            The 14-frame set made from the portrait (T-AVT-08d), in Cloud
            Storage avatars/{uid}/{frames_version}/ with avatar_frames.json;
            also written to users/{uid}/avatar/current.frames_version
    SpeakRequest:
      type: object
      additionalProperties: false
      required: [message_id, voice_id]
      properties:
        message_id:
          type: string
          maxLength: 400
          description: "{file}.{variant}@v{n} | routine.{a}.{line}+…@v{n} | lesson.{item}.{c1…|habit}@v{n} | orchestrator id | safety.…"
        voice_id: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        params:
          type: object
          maxProperties: 12
          description: >
            Closed-set values for the line's placeholders only: step_minutes,
            smaller_minutes, streak_days, weekly_count, routine_win_days
            (whole numbers 0-999), time_of_day (morning | afternoon |
            evening), time ("HH:MM"), routine_win (a catalog activity id).
            Lines with first_name, coach_name, why or step_title are refused.
          additionalProperties:
            oneOf:
              - {type: integer}
              - {type: string, pattern: "^[a-z0-9_:]{1,40}$"}
    SpeakResult:
      type: object
      required: [status, message_id]
      properties:
        status: {type: string, enum: [ok, neutral_device]}
        message_id: {type: string}
        voice_kind: {type: string, enum: [library, cloned, licensed]}
        ai_voice_label: {type: boolean, description: "FR-VOC-08: true for cloned and licensed voices"}
        mime: {type: string}
        audio_base64: {type: string, description: "Played in the app only; never offered for export (FR-VOC-05)"}
