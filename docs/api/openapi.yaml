openapi: 3.1.0
info:
  title: Live Well API
  version: "1"
  description: >
    Server endpoints (spec 12.1). Every call needs a Firebase ID token
    (Authorization: Bearer) and an App Check token (X-Firebase-AppCheck).
    Started in T-AVT-08c with the Media Service's avatar endpoints; other
    services add theirs here.
servers:
  - url: https://media.livewell.example/  # set per environment at deploy
security:
  - firebaseIdToken: []
    appCheck: []
paths:
  /v1/avatar:
    post:
      summary: Start making the coach's 3D avatar (Media Service, T-AVT-08c)
      description: >
        source selfie (From my photo; needs the avatar_from_photo flag and the
        camera and biometric consents), built (Build my own) or adjust (edit
        the approved portrait). Options are fixed ids from
        content/avatar/options.json; free text is refused. At most 3 a day
        (Remote Config avatar_daily_generations). The selfie is used for this
        job only and never stored.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AvatarRequest"}
      responses:
        "202":
          description: Job started (or the same job again for a repeated Idempotency-Key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvatarJob"}
        "401": {description: not_authorized}
        "403": {description: "feature_off | consent_required"}
        "413": {description: selfie_too_large}
        "422": {description: "bad_options | liveness_required | selfie_required | selfie_unreadable | selfie_not_jpeg | selfie_only_for_selfie_source"}
        "429": {description: avatar_daily_limit}
  /v1/avatar/jobs/{id}:
    get:
      summary: An avatar job's status (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvatarJob"}
        "401": {description: not_authorized}
        "404": {description: "not_found (also someone else's job)"}
  /v1/briefings/morning:
    servers:
      - url: https://agents.livewell.example/  # Agent Service; set per environment at deploy
    post:
      summary: Today's morning briefing for the caller (Agent Service, T-AGT-01 / T-FND-03 spike)
      description: >
        Order (spec 9.4, 9.7): Safety.pre screens every free-text field of the
        stored context with the shared red-flag rules (packages/safety-rules)
        before anything else; a red flag returns the fixed template for that
        category with no model call (emergency/crisis with the user's region
        numbers, both regions when the region is unknown, D-03) and voice
        neutral_device. Then the ai_disclosure consent is checked, then the
        LangGraph flow (context, Coach draft, Safety.post, at most one retry)
        returns an approved CoachMessage or the fixed fallback briefing. One
        briefing per user and local day (repeat calls return the same one).
        Spike: context comes from synthetic fixtures only (dev); D-91. Since
        T-AGT-04 this is the Coach Agent's `briefing` mode (D-98): same
        pipeline as the other Coach endpoints below.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BriefingRequest"}
      responses:
        "200":
          description: The briefing (route coach), the fixed fallback (route fallback) or a safety template (route safety_template)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CoachResponse"}
        "401": {description: not_authorized}
        "403": {description: "consent_required (ai_disclosure not granted; no model call was made)"}
        "404": {description: "no_context (no stored context for this user; in this slice only synthetic dev users exist)"}
        "422": {description: invalid body (unknown fields are refused)}
  /v1/conversation/turn:
    servers:
      - url: https://agents.livewell.example/  # Agent Service; set per environment at deploy
    post:
      summary: One Coach turn for the caller's chat message (Agent Service, T-AGT-04; spec 9.4, 12.1)
      description: >
        Coach Agent mode `reply` (D-98). Order, the same in every Coach mode:
        Safety.pre screens the message AND every free-text field of the
        stored context with the shared rules before anything else; a red flag
        returns the fixed template (emergency/crisis with the user's region
        numbers, both when the region is unknown, D-03) with voice
        neutral_device and no model call. With ai_disclosure consent the
        safety classifier may only escalate; it failing gives the fixed text.
        A safety event in the last 72 h gives the fixed text (no model, no
        portal). No consent gives 403. A message that looks like instructions
        is never sent to the model (fixed text, safety.checks has
        fallback:input_withheld). Otherwise approved passages are retrieved
        (approved-only, D-94) and the graph returns an approved CoachMessage
        (type reply; message.sources lists the passages it used; a health fact
        without a cited approved source is refused) or the fixed reply text.
        Text only for now (audio_ref and session memory come with T-CNV-01 /
        T-AGT-05); nothing is stored (persisting messages is a D-98 follow-up).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConversationTurnRequest"}
      responses:
        "200":
          description: The reply (route coach), the fixed reply text (route fallback) or a safety template (route safety_template)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CoachResponse"}
        "401": {description: not_authorized}
        "403": {description: "consent_required (ai_disclosure not granted; no model call was made)"}
        "404": {description: "no_context (no stored context for this user)"}
        "422": {description: invalid body (unknown fields are refused; text 1-1000 characters)}
  /v1/reflections:
    servers:
      - url: https://agents.livewell.example/  # Agent Service; set per environment at deploy
    post:
      summary: The Coach's reply to the caller's evening reflection (Agent Service, T-AGT-04; FR-DLY-05)
      description: >
        Coach Agent mode `reflection` (D-98), same order as
        /v1/conversation/turn; the reflection text is screened like the
        context. Returns message.type reply and, on route coach, `barrier`
        (a fixed code: what got in the way) as a proposal for the plan builder;
        nothing is changed or stored here. The app keeps saving the reflection
        itself at users/{uid}/reflections/{date} (data-model.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReflectionRequest"}
      responses:
        "200":
          description: The reply (route coach), the fixed reflection text (route fallback) or a safety template
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CoachResponse"}
        "401": {description: not_authorized}
        "403": {description: "consent_required (no model call was made)"}
        "404": {description: no_context}
        "422": {description: invalid body (text 1-500 characters)}
  /v1/nudges/copy:
    servers:
      - url: https://agents.livewell.example/  # Agent Service; set per environment at deploy
    post:
      summary: The words of one anchored nudge (Agent Service, T-AGT-04; FR-DLY-04, FR-TCH-02; job endpoint, not in spec 12.1)
      description: >
        Coach Agent mode `nudge` (D-98). For the nudge scheduler (T-DLY-04),
        which alone decides whether and when a nudge is sent (caps, quiet
        hours); this only writes the copy (at most 160 characters). The model
        is never sent the name, the Why or check-in values, and a draft that
        contains the name or the Why is refused (nothing personal on a lock
        screen, AGENTS.md). Same safety order as every mode. Caller auth is the
        user's token in this slice; service-to-service auth for the scheduler
        is a follow-up (D-98).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NudgeRequest"}
      responses:
        "200":
          description: The nudge (route coach), the fixed nudge text (route fallback) or a safety template
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CoachResponse"}
        "401": {description: not_authorized}
        "403": {description: "consent_required (no model call was made)"}
        "404": {description: no_context}
        "422": {description: invalid body}
  /v1/reviews/weekly:
    servers:
      - url: https://agents.livewell.example/  # Agent Service; set per environment at deploy
    post:
      summary: This week's review (Agent Service, T-AGT-04; FR-DLY-06; job endpoint, not in spec 12.1)
      description: >
        Coach Agent mode `weekly_review` (D-98). The week's numbers are
        precomputed by the caller (the Insights Agent, T-AGT-06, is not built
        yet) and sent as `stats`: counts and trend codes only. Same safety
        order as every mode; reading numbers as a condition is refused. No
        portal card (always null until T-AGT-07). Caller auth as for nudges.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeeklyReviewRequest"}
      responses:
        "200":
          description: The review (route coach), the fixed review text (route fallback) or a safety template
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CoachResponse"}
        "401": {description: not_authorized}
        "403": {description: "consent_required (no model call was made)"}
        "404": {description: no_context}
        "422": {description: invalid body}
components:
  securitySchemes:
    firebaseIdToken: {type: http, scheme: bearer}
    appCheck: {type: apiKey, in: header, name: X-Firebase-AppCheck}
  schemas:
    AvatarRequest:
      type: object
      required: [source]
      properties:
        source: {type: string, enum: [selfie, built, adjust]}
        options:
          type: object
          maxProperties: 20
          additionalProperties: {type: string}
          description: category id → option id, from content/avatar/options.json
        selfie_jpeg_base64:
          type: string
          description: The live selfie (JPEG, at most 4 MB), only for source selfie
        liveness:
          type: string
          enum: [blink, turn]
          description: How the app saw a live person (T-AVT-08e); required for source selfie
    AvatarJob:
      type: object
      required: [job_id, source, status]
      properties:
        job_id: {type: string}
        source: {type: string, enum: [selfie, built, adjust]}
        status: {type: string, enum: [queued, running, succeeded, rejected, failed]}
        message_id:
          type: [string, "null"]
          description: "A kind message for the app to show: avatar_not_made | avatar_no_portrait"
        portrait_id:
          type: [string, "null"]
          description: The approved portrait the frame set is built from
        frames_version:
          type: [integer, "null"]
          description: >
            The 14-frame set made from the portrait (T-AVT-08d), in Cloud
            Storage avatars/{uid}/{frames_version}/ with avatar_frames.json;
            also written to users/{uid}/avatar/current.frames_version
    BriefingRequest:
      type: object
      additionalProperties: false
      properties:
        local_date:
          type: string
          format: date
          description: The user's local date; defaults to the date in the stored context
    CoachResponse:
      type: object
      description: What every Coach Agent endpoint returns (T-AGT-01 called it BriefingResponse).
      required: [route, voice, message]
      properties:
        route: {type: string, enum: [coach, fallback, safety_template]}
        voice:
          type: string
          enum: [neutral_device, gateway]
          description: >
            neutral_device for safety templates (FR-VOC-07); otherwise the app
            asks the voice gateway with message.message_id (closed-script
            rule, D-88). message.contains_user_text is true for model text, so
            cloned voices refuse it.
        message:
          $ref: "../../packages/schemas/coach_message.schema.json"
        barrier:
          type: [string, "null"]
          enum: [none, time, energy, motivation, schedule, weather, social, unwell, other, null]
          description: >
            Reflection mode, route coach only: what got in the way, as a fixed
            code. A proposal for the nightly plan builder (FR-DLY-05); never
            applied by the agent. Null otherwise.
    BriefingResponse:
      $ref: "#/components/schemas/CoachResponse"
    ConversationTurnRequest:
      type: object
      additionalProperties: false
      required: [text, session_id]
      properties:
        text: {type: string, minLength: 1, maxLength: 1000}
        session_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
        local_date: {type: string, format: date}
    ReflectionRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
        prompt: {type: string, enum: [went_well], default: went_well}
        local_date: {type: string, format: date}
    NudgeRequest:
      type: object
      additionalProperties: false
      required: [time_of_day]
      properties:
        time_of_day: {type: string, enum: [morning, midday, evening]}
        local_date: {type: string, format: date}
    WeeklyStats:
      type: object
      additionalProperties: false
      required: [week_start, days_checked_in, habit_days_done, habit_days_planned, streak_days]
      properties:
        week_start: {type: string, format: date}
        days_checked_in: {type: integer, minimum: 0, maximum: 7}
        habit_days_done: {type: integer, minimum: 0, maximum: 7}
        habit_days_planned: {type: integer, minimum: 0, maximum: 7}
        streak_days: {type: integer, minimum: 0, maximum: 10000}
        restarts: {type: integer, minimum: 0, maximum: 7, default: 0}
        mood_trend: {type: string, enum: [up, steady, down, unknown], default: unknown}
        energy_trend: {type: string, enum: [up, steady, down, unknown], default: unknown}
        stress_trend: {type: string, enum: [up, steady, down, unknown], default: unknown}
    WeeklyReviewRequest:
      type: object
      additionalProperties: false
      required: [stats]
      properties:
        stats: {$ref: "#/components/schemas/WeeklyStats"}
        local_date: {type: string, format: date}
