openapi: 3.1.0
info:
  title: Live Well API
  version: "1"
  description: >
    Server endpoints (spec 12.1). Every call needs a Firebase ID token
    (Authorization: Bearer) and an App Check token (X-Firebase-AppCheck).
    Started in T-AVT-08c with the Media Service's avatar endpoints; other
    services add theirs here.
servers:
  - url: https://media.livewell.example/  # set per environment at deploy
security:
  - firebaseIdToken: []
    appCheck: []
paths:
  /v1/avatar:
    post:
      summary: Start making the coach's 3D avatar (Media Service, T-AVT-08c)
      description: >
        source selfie (From my photo; needs the avatar_from_photo flag and the
        camera and biometric consents), built (Build my own) or adjust (edit
        the approved portrait). Options are fixed ids from
        content/avatar/options.json; free text is refused. At most 3 a day
        (Remote Config avatar_daily_generations). The selfie is used for this
        job only and never stored.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AvatarRequest"}
      responses:
        "202":
          description: Job started (or the same job again for a repeated Idempotency-Key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvatarJob"}
        "401": {description: not_authorized}
        "403": {description: "feature_off | consent_required"}
        "413": {description: selfie_too_large}
        "422": {description: "bad_options | liveness_required | selfie_required | selfie_unreadable | selfie_not_jpeg | selfie_only_for_selfie_source"}
        "429": {description: avatar_daily_limit}
  /v1/avatar/jobs/{id}:
    get:
      summary: An avatar job's status (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvatarJob"}
        "401": {description: not_authorized}
        "404": {description: "not_found (also someone else's job)"}
  # ---------- Core API: portal catalog for the Admin / CMS (T-PRT-02, D-92) ----------
  # Firebase callable functions (Cloud Functions 2nd gen, us-central1 until
  # regions are decided). Callable protocol: POST {"data": <request>}, reply
  # {"result": <response>} or {"error": {"status", "message", "details":
  # {"reason"}}}. Staff only: the ID token must carry `staff_roles` and pass
  # the MFA gate (a second factor, or the owner's time-limited
  # `staff_mfa_waiver_until`); otherwise 403 with reason not_staff,
  # mfa_required or role. Every write is audited (ids, statuses and field
  # names only). App Check is not enforced yet (owner follow-up).
  /adminListPortalOffers:
    servers: [{url: "https://us-central1-{project}.cloudfunctions.net", variables: {project: {default: my-livewell}}}]
    post:
      summary: Every portal offer with its workflow (any staff role)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {data: {type: object, additionalProperties: false}}}
      responses:
        "200":
          description: The catalog, newest change first (at most 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      offers: {type: array, items: {$ref: "#/components/schemas/AdminPortalOffer"}}
        "401": {description: unauthenticated}
        "403": {description: "not_staff | mfa_required | role"}
  /adminCreatePortalOffer:
    servers: [{url: "https://us-central1-{project}.cloudfunctions.net", variables: {project: {default: my-livewell}}}]
    post:
      summary: New offer as a draft, not live (content_editor, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required: [fields]
                  additionalProperties: false
                  properties:
                    fields: {$ref: "#/components/schemas/PortalOfferFields"}
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {result: {type: object, properties: {id: {type: string}, rev: {type: integer}}}}}
        "400": {description: invalid (field errors in details.issues)}
        "401": {description: unauthenticated}
        "403": {description: "not_staff | mfa_required | role"}
  /adminUpdatePortalOffer:
    servers: [{url: "https://us-central1-{project}.cloudfunctions.net", variables: {project: {default: my-livewell}}}]
    post:
      summary: Edit an offer (content_editor, admin). Any change takes it offline and back to draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required: [id, expected_rev, fields]
                  additionalProperties: false
                  properties:
                    id: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
                    expected_rev: {type: integer, minimum: 1, description: "The rev the editor saw; a newer one means someone else changed it"}
                    fields: {$ref: "#/components/schemas/PortalOfferFields"}
      responses:
        "200":
          description: Saved (changed false when nothing differed; nothing is written or logged then)
          content:
            application/json:
              schema: {type: object, properties: {result: {type: object, properties: {id: {type: string}, rev: {type: integer}, changed: {type: boolean}}}}}
        "400": {description: "invalid | wrong_status (archived)"}
        "403": {description: "not_staff | mfa_required | role"}
        "404": {description: not_found}
        "409": {description: stale}
  /adminTransitionPortalOffer:
    servers: [{url: "https://us-central1-{project}.cloudfunctions.net", variables: {project: {default: my-livewell}}}]
    post:
      summary: A review step
      description: >
        submit / withdraw / publish / archive / restore: content_editor, admin.
        approve / reject: clinical_reviewer, admin; nobody approves a version
        they edited or submitted (own_offer). publish only when approved
        (editors publish, spec 17.4). unpublish: any staff role.
        draft|rejected -submit-> in_review -approve-> approved -publish-> live
        (active); in_review -reject-> rejected; in_review -withdraw-> draft;
        any -archive-> archived -restore-> draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required: [id, expected_rev, action]
                  additionalProperties: false
                  properties:
                    id: {type: string}
                    expected_rev: {type: integer, minimum: 1}
                    action: {type: string, enum: [submit, withdraw, approve, reject, publish, unpublish, archive, restore]}
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      id: {type: string}
                      rev: {type: integer}
                      review_status: {$ref: "#/components/schemas/ReviewStatus"}
                      active: {type: boolean}
        "400": {description: "invalid | wrong_status | own_offer | not_active | already_active"}
        "403": {description: "not_staff | mfa_required | role"}
        "404": {description: not_found}
        "409": {description: stale}
components:
  securitySchemes:
    firebaseIdToken: {type: http, scheme: bearer}
    appCheck: {type: apiKey, in: header, name: X-Firebase-AppCheck}
  schemas:
    PortalOfferFields:
      type: object
      description: What an editor writes (T-PRT-02). Shown to app users exactly as entered.
      required: [title, url, offer_type]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 3, maxLength: 80, description: One line}
        description: {type: string, maxLength: 240, default: "", description: One line; no health-outcome claims (13.4, checked in clinical review)}
        url:
          type: string
          maxLength: 500
          description: https on livewell.conciergeconnectedcare.net only; no port, credentials, fragment, utm_* or lw_cid (the app adds attribution)
        offer_type: {type: string, enum: [course, program, free_lesson, coaching]}
        driver_tags: {type: array, maxItems: 8, items: {type: string, pattern: "^[a-z][a-z0-9_]{0,31}$"}}
        topic_tags: {type: array, maxItems: 8, items: {type: string, pattern: "^[a-z][a-z0-9_]{0,31}$"}}
        price_display: {type: string, maxLength: 24, default: "", description: Empty for free_lesson; empty on a paid offer shows "Paid course"}
    ReviewStatus: {type: string, enum: [draft, in_review, approved, rejected, archived]}
    AdminPortalOffer:
      allOf:
        - $ref: "#/components/schemas/PortalOfferFields"
        - type: object
          properties:
            id: {type: string}
            review_status: {$ref: "#/components/schemas/ReviewStatus"}
            active: {type: boolean, description: Live in the app only when true and approved}
            version: {type: integer, description: Content version, +1 per edit}
            rev: {type: integer, description: Revision, +1 per write; send as expected_rev}
            version_editors: {type: array, items: {type: string}, description: Staff uids who changed this version (two-person rule)}
            submitted_by: {type: [string, "null"]}
            created_by: {type: [string, "null"]}
            last_action: {type: [string, "null"]}
            last_actor: {type: [string, "null"]}
            updated_at: {type: [string, "null"], format: date-time}
    AvatarRequest:
      type: object
      required: [source]
      properties:
        source: {type: string, enum: [selfie, built, adjust]}
        options:
          type: object
          maxProperties: 20
          additionalProperties: {type: string}
          description: category id → option id, from content/avatar/options.json
        selfie_jpeg_base64:
          type: string
          description: The live selfie (JPEG, at most 4 MB), only for source selfie
        liveness:
          type: string
          enum: [blink, turn]
          description: How the app saw a live person (T-AVT-08e); required for source selfie
    AvatarJob:
      type: object
      required: [job_id, source, status]
      properties:
        job_id: {type: string}
        source: {type: string, enum: [selfie, built, adjust]}
        status: {type: string, enum: [queued, running, succeeded, rejected, failed]}
        message_id:
          type: [string, "null"]
          description: "A kind message for the app to show: avatar_not_made | avatar_no_portrait"
        portrait_id:
          type: [string, "null"]
          description: The approved portrait the frame set is built from
        frames_version:
          type: [integer, "null"]
          description: >
            The 14-frame set made from the portrait (T-AVT-08d), in Cloud
            Storage avatars/{uid}/{frames_version}/ with avatar_frames.json;
            also written to users/{uid}/avatar/current.frames_version
