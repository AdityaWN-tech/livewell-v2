openapi: 3.1.0
info:
  title: Live Well API
  version: "1"
  description: >
    Server endpoints (spec 12.1). Every call needs a Firebase ID token
    (Authorization: Bearer) and an App Check token (X-Firebase-AppCheck).
    Started in T-AVT-08c with the Media Service's avatar endpoints; other
    services add theirs here.
servers:
  - url: https://media.livewell.example/  # set per environment at deploy
security:
  - firebaseIdToken: []
    appCheck: []
paths:
  /v1/avatar:
    post:
      summary: Start making the coach's 3D avatar (Media Service, T-AVT-08c)
      description: >
        source selfie (From my photo; needs the avatar_from_photo flag and the
        camera and biometric consents), built (Build my own) or adjust (edit
        the approved portrait). Options are fixed ids from
        content/avatar/options.json; free text is refused. At most 3 a day
        (Remote Config avatar_daily_generations). The selfie is used for this
        job only and never stored.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AvatarRequest"}
      responses:
        "202":
          description: Job started (or the same job again for a repeated Idempotency-Key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvatarJob"}
        "401": {description: not_authorized}
        "403": {description: "feature_off | consent_required"}
        "413": {description: selfie_too_large}
        "422": {description: "bad_options | liveness_required | selfie_required | selfie_unreadable | selfie_not_jpeg | selfie_only_for_selfie_source"}
        "429": {description: avatar_daily_limit}
  /v1/avatar/jobs/{id}:
    get:
      summary: An avatar job's status (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvatarJob"}
        "401": {description: not_authorized}
        "404": {description: "not_found (also someone else's job)"}
  /requestDataExport:
    post:
      summary: Ask for a copy of my data (core-api callable, FR-SET-02, T-CMP-03, D-82)
      description: >
        Firebase callable (Cloud Functions 2nd gen, us-central1; the app calls
        it with cloud_functions httpsCallable). Signed-in account that passed
        the 18+ gate only. One export per 24 hours; a failed export, or one
        still preparing after an hour, does not count. Writes
        users/{uid}/data_exports/{jobId} (status preparing) and an audit entry
        with no content; the onDataExportRequested trigger then builds a zip
        (data.json, summary.pdf, README.txt) at Cloud Storage
        exports/{uid}/{jobId}.zip, kept 7 days, and sets status ready (with
        expires_at and per-collection counts) or failed.
      servers:
        - url: https://us-central1-PROJECT.cloudfunctions.net/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: {type: object, maxProperties: 0}
      responses:
        "200":
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [jobId]
                    properties:
                      jobId: {type: string}
        "400": {description: "FAILED_PRECONDITION: no profile or the 18+ gate was not passed"}
        "401": {description: "UNAUTHENTICATED"}
        "429":
          description: >
            RESOURCE_EXHAUSTED: one export a day; error.details has
            retry_after (ISO 8601) and job_id (the export that counts)
  /getDataExportLink:
    post:
      summary: A short-lived download link for my ready export (core-api callable, D-82)
      description: >
        Firebase callable. Returns a V4 signed URL valid for 15 minutes (never
        past the export's expires_at) for the caller's own ready export.
        Each link is audit-logged with no content.
      servers:
        - url: https://us-central1-PROJECT.cloudfunctions.net/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [jobId]
                  properties:
                    jobId: {type: string, pattern: "^[A-Za-z0-9]{1,40}$"}
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [url, expiresAt]
                    properties:
                      url: {type: string, format: uri}
                      expiresAt: {type: string, format: date-time}
        "400": {description: "INVALID_ARGUMENT (bad jobId) | FAILED_PRECONDITION (the export expired)"}
        "401": {description: "UNAUTHENTICATED"}
        "404": {description: "NOT_FOUND: no such ready export of the caller (also someone else's)"}
components:
  securitySchemes:
    firebaseIdToken: {type: http, scheme: bearer}
    appCheck: {type: apiKey, in: header, name: X-Firebase-AppCheck}
  schemas:
    AvatarRequest:
      type: object
      required: [source]
      properties:
        source: {type: string, enum: [selfie, built, adjust]}
        options:
          type: object
          maxProperties: 20
          additionalProperties: {type: string}
          description: category id → option id, from content/avatar/options.json
        selfie_jpeg_base64:
          type: string
          description: The live selfie (JPEG, at most 4 MB), only for source selfie
        liveness:
          type: string
          enum: [blink, turn]
          description: How the app saw a live person (T-AVT-08e); required for source selfie
    AvatarJob:
      type: object
      required: [job_id, source, status]
      properties:
        job_id: {type: string}
        source: {type: string, enum: [selfie, built, adjust]}
        status: {type: string, enum: [queued, running, succeeded, rejected, failed]}
        message_id:
          type: [string, "null"]
          description: "A kind message for the app to show: avatar_not_made | avatar_no_portrait"
        portrait_id:
          type: [string, "null"]
          description: The approved portrait the frame set is built from
        frames_version:
          type: [integer, "null"]
          description: >
            The 14-frame set made from the portrait (T-AVT-08d), in Cloud
            Storage avatars/{uid}/{frames_version}/ with avatar_frames.json;
            also written to users/{uid}/avatar/current.frames_version
