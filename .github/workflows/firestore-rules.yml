# Firestore security rules tests (T-FND-06). Runs the rules against the
# Firestore emulator and enforces the rule-coverage gate.
name: firestore-rules

on:
  pull_request:
    paths: ["firebase/**", "firebase.json", ".github/workflows/firestore-rules.yml"]
  push:
    branches: [main]
    paths: ["firebase/**", "firebase.json", ".github/workflows/firestore-rules.yml"]

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: firebase

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload rule coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-coverage
          path: firebase/coverage/rule-coverage.html
