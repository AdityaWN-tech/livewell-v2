[project]
name = "livewell-media"
version = "0.1.0"
description = "Live Well Media Service: avatar generation jobs (T-AVT-08c)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.32",
  "pillow>=11",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["aiohttp>=3.9", "pytest>=8", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = [
  "S101",  # assert is fine in tests
  "N818",  # exception names say what happened (NotAuthorized, DailyLimitReached)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["media"]
